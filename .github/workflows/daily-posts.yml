name: Daily Russo Pavimenti Post

# Slot UTC schedule (CEST summer, UTC+2):
#   08:00 IT = 06:00 UTC  (morning)
#   12:30 IT = 10:30 UTC  (lunch)
#   17:30 IT = 15:30 UTC  (evening)
# Adjust +1h during winter DST (CET, UTC+1).
#
# GitHub Actions cron on free tier can:
#   - delay 1-4 hours
#   - skip individual triggers entirely
#   - batch parallel triggers
#
# Defense:
#   1) High redundancy: 6 triggers per slot in a 20-min window
#   2) Safety net: 4 extra triggers spread across the day at non-peak minutes
#      that catch missed slots via self-healing recovery
#   3) Python script (daily_post_cron.py) self-heals: any run that fires
#      checks all slots scheduled-but-not-done today and processes them.
#      Idempotent + CAS-claim → safe even with parallel triggers.

on:
  schedule:
    # Morning window (target 06:00 UTC = 08:00 IT)
    - cron: '53 5 * * *'
    - cron: '55 5 * * *'
    - cron: '57 5 * * *'
    - cron: '59 5 * * *'
    - cron: '3 6 * * *'
    - cron: '7 6 * * *'

    # Lunch window (target 10:30 UTC = 12:30 IT)
    - cron: '23 10 * * *'
    - cron: '25 10 * * *'
    - cron: '27 10 * * *'
    - cron: '29 10 * * *'
    - cron: '33 10 * * *'
    - cron: '37 10 * * *'

    # Evening window (target 15:30 UTC = 17:30 IT)
    - cron: '23 15 * * *'
    - cron: '25 15 * * *'
    - cron: '27 15 * * *'
    - cron: '29 15 * * *'
    - cron: '33 15 * * *'
    - cron: '37 15 * * *'

    # Safety net: 4 catch-all triggers throughout the day.
    # These fire AFTER each slot window, so they only trigger work if any
    # of the slot-specific cron runs got skipped by GH Actions. The python
    # script's self-healing logic figures out what's missing and runs it.
    - cron: '47 7 * * *'    # ~09:47 IT, after morning window
    - cron: '17 12 * * *'   # ~14:17 IT, after lunch window
    - cron: '47 16 * * *'   # ~18:47 IT, after evening window
    - cron: '17 19 * * *'   # ~21:17 IT, last chance catch-all

  workflow_dispatch:
    inputs:
      slot:
        description: 'Manual slot (morning/lunch/evening/auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - lunch
          - evening

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post generator
        env:
          # On schedule triggers DAILY_SLOT=auto → self-healing recovery
          # On workflow_dispatch use the user-selected slot (or 'auto')
          DAILY_SLOT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.slot || 'auto' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: russopavimenti
          GITHUB_REPO_NAME: russo-pavimenti-webhook
          GITHUB_BRANCH: main
        run: python daily_post_cron.py
