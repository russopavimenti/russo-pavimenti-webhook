# Render Blueprint — deploys the webhook + 3 daily-post cron jobs.
# https://render.com/docs/blueprint-spec

# === Shared env vars across web + cron services ===
envVarGroups:
  - name: russo-pavimenti-shared
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: GITHUB_REPO_OWNER
        value: russopavimenti
      - key: GITHUB_REPO_NAME
        value: russo-pavimenti-webhook
      - key: GITHUB_BRANCH
        value: main

services:
  - type: web
    name: russo-pavimenti-webhook
    runtime: python
    plan: free
    region: frankfurt   # closer to Italy than Oregon default
    branch: main
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - fromGroup: russo-pavimenti-shared
      - key: PYTHON_VERSION
        value: 3.11.9

      # === Webhook-only secrets ===
      - key: COMPOSIO_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_PATH_SECRET
        sync: false
      # Optional: enables autonomous Claude agent responses on Telegram
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929

      - key: IG_USER_ID
        value: "26664442679877111"
      - key: COMPOSIO_ENTITY_ID
        value: default

  # === 3 daily cron jobs ===
  # Schedule is UTC. Italy = UTC+2 (summer/CEST) or UTC+1 (winter/CET).
  # Current values target SUMMER time. Adjust +1 hour during winter DST.
  #   08:00 IT (CEST) = 06:00 UTC
  #   12:30 IT (CEST) = 10:30 UTC
  #   17:30 IT (CEST) = 15:30 UTC

  - type: cron
    name: russo-daily-morning
    runtime: python
    region: frankfurt
    branch: main
    schedule: "0 6 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python daily_post_cron.py
    envVars:
      - fromGroup: russo-pavimenti-shared
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAILY_SLOT
        value: morning

  - type: cron
    name: russo-daily-lunch
    runtime: python
    region: frankfurt
    branch: main
    schedule: "30 10 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python daily_post_cron.py
    envVars:
      - fromGroup: russo-pavimenti-shared
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAILY_SLOT
        value: lunch

  - type: cron
    name: russo-daily-evening
    runtime: python
    region: frankfurt
    branch: main
    schedule: "30 15 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python daily_post_cron.py
    envVars:
      - fromGroup: russo-pavimenti-shared
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DAILY_SLOT
        value: evening
