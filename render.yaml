# Render Blueprint — deploys the webhook only.
# Daily cron jobs moved to GitHub Actions (.github/workflows/daily-posts.yml)
# because Render doesn't include cron in the free tier.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: russo-pavimenti-webhook
    runtime: python
    plan: free
    region: frankfurt   # closer to Italy than Oregon default
    branch: main
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # === Secrets (must be set MANUALLY in Render dashboard) ===
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_PATH_SECRET
        sync: false
      # Optional: enables autonomous Claude agent responses on Telegram
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
      # Pexels API key
      - key: PEXELS_API_KEY
        sync: false
      # GitHub PAT for private repo content read (kept here for compatibility)
      - key: GITHUB_TOKEN
        sync: false

      # === Public IDs / config ===
      - key: IG_USER_ID
        value: "26664442679877111"
      - key: GITHUB_REPO_OWNER
        value: russopavimenti
      - key: GITHUB_REPO_NAME
        value: russo-pavimenti-webhook
      - key: GITHUB_BRANCH
        value: main
      - key: COMPOSIO_ENTITY_ID
        value: default
